langcode: en
status: true
dependencies:
  module:
    - shentity
title: 'Shentity: Refresh Google Sheets'
id: shentity_refresh_sheets
weight: 10
module: shentity
callback: '\Drupal\shentity\Services\CronManager::refreshSheets'
scheduler:
  id: crontab
  configuration:
    rules:
      - '0 4-23 * * *'
    catch_up: 3600
launcher:
  id: serial
  configuration:
    timeouts:
      lock_timeout: 3600
    launcher:
      thread: 0
logger:
  id: database
  configuration:
    method: '3'
    expire: 1209600
    retain: 1000
